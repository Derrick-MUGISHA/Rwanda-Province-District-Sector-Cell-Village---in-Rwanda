name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number only, no prefix (example: 1.1.0)"
        required: true
        type: string
      publish_npm:
        description: "Publish npm package"
        required: true
        default: true
        type: boolean
      publish_python:
        description: "Publish Python package"
        required: true
        default: true
        type: boolean
      publish_maven:
        description: "Publish Maven package"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Reusable guard: every job sources this first so a malformed version input
# (e.g. "v1.1.0" or "version 1.1.0") fails fast with one clear message.
env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "::error::Invalid version input '$RELEASE_VERSION'. Enter the number only, e.g. 1.1.0 (no 'v', no 'version')."
            exit 1
          }

  npm:
    needs: validate-input
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-github:
    needs: validate-input
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          cache: npm
      - run: npm ci
      - run: npm version ${{ inputs.version }} --no-git-tag-version
      # GitHub Packages requires the scope to match the repository owner.
      - run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@derrick-mugisha/rwanda-admin-hierarchy';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    needs: validate-input
    if: ${{ inputs.publish_python }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build python
      - run: python -m twine check python/dist/*
      # The version uploaded to PyPI comes from python/pyproject.toml — keep it
      # in sync with the workflow's version input.
      - name: Check pyproject version matches release version
        run: |
          grep -q '^version = "${{ inputs.version }}"' python/pyproject.toml || {
            echo "python/pyproject.toml version does not match ${{ inputs.version }} — bump it and re-run."
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  maven:
    needs: validate-input
    if: ${{ inputs.publish_maven }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: mvn -f java-mvn/pom.xml -B -Drevision=${{ inputs.version }} clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [validate-input, npm, npm-github, python, maven]
    if: ${{ always() && needs.validate-input.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && (needs.npm-github.result == 'success' || needs.npm-github.result == 'skipped') && (needs.python.result == 'success' || needs.python.result == 'skipped') && (needs.maven.result == 'success' || needs.maven.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate CSV/SQL/SQLite exports
        run: npm run export:data
      - name: Create git tag
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: |
            exports/villages.csv
            exports/rwanda.sql
            exports/rwanda.sqlite
            data/rwanda-administrative.json
            data/changes.json
