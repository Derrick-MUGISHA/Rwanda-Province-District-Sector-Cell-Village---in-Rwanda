[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwanda-admin"
version = "1.4.0"
description = "Rwanda administrative hierarchy dataset and query helpers."
readme = "README.md"
requires-python = ">=3.9"
license = "ISC"
authors = [
  { name = "Derrick MUGISHA" }
]
keywords = [
  "rwanda", "administrative", "province", "district", "sector", "cell", "village",
  "nisr", "umudugudu", "iso-3166", "address-validation", "east-africa", "geodata", "dataset",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
django = ["django>=4.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rwanda_admin*"]

[tool.setuptools.package-data]
rwanda_admin = ["rwanda_administrative.json"]
